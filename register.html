<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Device Registration</h1>
        <p style="margin-bottom: 20px;">Ask your teacher for your one-time Registration Code.</p>
        <div id="status"></div>
        <form id="regForm">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="e.g. John Doe" required>
            
            <label>Roll Number</label>
            <input type="text" id="rollNumber" placeholder="e.g. 101" required>
            
            <label>Create a 4-Digit PIN</label>
            <input type="password" id="pin" maxlength="4" pattern="\d{4}" placeholder="e.g. 1234" required>
            
            <button type="submit" class="btn btn-primary" id="btnSubmit">Register Device</button>
        </form>
        <a href="index.html" class="btn btn-secondary" style="margin-top: 10px;">Back to Home</a>
    </div>
    <script src="js/api.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
